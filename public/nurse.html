<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<title>Nurse Station</title>


<script src="/socket.io/socket.io.js"></script>


<link rel="stylesheet" href="/css/00-base.css">
<link rel="stylesheet" href="/css/01-layout.css">
<link rel="stylesheet" href="/css/02-ui.css">
<!-- แล้วค่อย page -->
<link rel="stylesheet" href="/css/nurse.css">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

<div class="app-container">

  <!-- ================= SIDEBAR ================= -->
<div class="sidebar">

<!-- LOGO -->
<div class="sidebar-logo">
  <img src="/image/logoMMT.png" alt="Mithmitree Logo">
  <h3>SCREENNING</h3>
  <small>Smart Queue System</small>
</div>

  <a href="analytics.html">Dashboard</a>
  <a href="doctor.html">Doctor</a>
  <a class="active" href="nurse.html">Screening</a>
  <a href="treatment.html">Treatment</a>
  <a href="pharmacy.html">Pharmacy</a>

</div>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <!-- HEADER CARD -->
    <div class="card">
      <div class="card-header">
        📋 รายการคิวผู้รับบริการ (Queue Management)
      </div>

      <table class="table">
        <thead>
          <tr>
            <th>คิว</th>
            <th>ชื่อผู้รับบริการ</th>
            <th>ห้อง</th>
            <th>สถานะ</th>
            <th>การจัดการ</th>
          </tr>
        </thead>

        <tbody id="patientTable"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- ================= FLOAT BUTTON ================= -->
<button class="btn btn-primary"
        style="position:fixed;bottom:25px;right:25px;width:60px;height:60px;border-radius:50%;font-size:24px;"
        onclick="openModal()">
+
</button>

<!-- ================= MODAL ================= -->
<div class="modal fade" id="queueModal">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">เพิ่มผู้รับบริการเข้าคิว</h5>
        <button type="button" class="btn-close" onclick="closeModal()"></button>
      </div>

      <div class="modal-body">

        <label>เลขคิว</label>
        <input id="queueNo" class="input" readonly>

        <label>ชื่อผู้รับบริการ</label>
        <input id="name" class="input">

        <label>หน่วยบริการ</label>
        <input class="input" value="ห้องตรวจโรค" readonly>

      </div>

      <div class="modal-footer">
        <button class="btn btn-soft" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="sendPatient()">บันทึก</button>
      </div>

    </div>
  </div>
</div>

<script>

const socket = io();
let patients = [];
const room = "1";

socket.emit("joinRoom", room);
socket.emit("getQueue", room);

socket.on("updateQueue", list => {
    patients = list;
    renderTable();
    
});

const roomNames = {
    "1": "ห้องตรวจโรค",
    "2": "ห้องจ่ายยา",
    "3": "ห้องหัตถการ"
};

function renderTable(){
    let html = "";

    patients.forEach(p => {

        if(p.status === "waiting"){
    badgeClass = "badge-observe";
    statusText = "รอเรียก";
}

if(p.status === "called"){
    badgeClass = "badge-stable";
    statusText = "เรียกแล้ว";
}

if(p.status === "treatment"){
    badgeClass = "badge-warning";
    statusText = "หัตถการ";
}

if(p.status === "pharmacy"){
    badgeClass = "badge-info";
    statusText = "จ่ายยา";
}

if(p.status === "done"){
    badgeClass = "badge-success";
    statusText = "เสร็จสิ้น";
}

        html += `
        <tr>
            <td><strong>${p.queueNo}</strong></td>
            <td>${p.name}</td>
            <td>${roomNames[p.room] || p.room}</td>
            <td><span class="badge ${badgeClass}">${statusText}</span></td>
            <td>
                <button class="btn btn-danger btn-sm"
                    onclick="deletePatient('${p.queueNo}', '${p.room}')">
                    ลบ
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("patientTable").innerHTML = html;
}

function generateQueue(){
    const total = patients.length + 1;
    let q = "A" + String(total).padStart(3,"0");
    document.getElementById("queueNo").value = q;
}

/* ================= MODAL ================= */

let modal;

document.addEventListener("DOMContentLoaded", function(){
  modal = new bootstrap.Modal(document.getElementById('queueModal'));
});

function openModal(){
  generateQueue();
  modal.show();
}

function closeModal(){
  modal.hide();
}

/* ================= SOCKET ================= */

function sendPatient(){

    let name = document.getElementById("name").value;
    let queueNo = document.getElementById("queueNo").value;

    if(!name){
        alert("กรุณากรอกชื่อผู้รับบริการ");
        return;
    }

    socket.emit("addPatient", {
        queueNo,
        name,
        room,
        status: "รอเรียก"
    });

    document.getElementById("name").value = "";
    closeModal();
}

function deletePatient(queueNo, room){

    if(!confirm("ต้องการลบคิวนี้ใช่หรือไม่?")) return;

    socket.emit("deletePatient", {
        queueNo,
        room
    });
}

</script>

</body>
</html>
