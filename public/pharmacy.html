<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Pharmacy Room</title>

<script src="/socket.io/socket.io.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/00-base.css">
<link rel="stylesheet" href="/css/01-layout.css">
<link rel="stylesheet" href="/css/02-ui.css">
<!-- แล้วค่อย page -->
<link rel="stylesheet" href="/css/pharmacy.css">


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>

<body>

<div class="app-container">

  <!-- ================= SIDEBAR ================= -->
<div class="sidebar">
<!-- LOGO -->
<div class="sidebar-logo">
  <img src="/image/logoMMT.png" alt="Mithmitree Logo">
  <h3>P H A R M A C Y</h3>
  <small>Smart Queue System</small>
</div>

  <a href="analytics.html">Dashboard</a>
  <a href="doctor.html">Doctor</a>
  <a href="nurse.html">Screening</a>
  <a href="treatment.html">Treatment</a>
  <a class="active" href="pharmacy.html">Pharmacy</a>

</div>

  <!-- ================= MAIN ================= -->
  <div class="main">

    <div class="card">

      <div class="card-header flex gap-10">

        💊 ห้องจ่ายยา

      </div>

      <table class="table">

        <thead>
          <tr>
            <th style="width: 80px;">ลำดับที่</th>
            <th style="width: 80px;">คิว</th>
            <th style="width: 180px;">ชื่อผู้รับบริการ</th>
            <th style="width: 110px;">Doctor Note</th>
            <th style="width: 80px;">สถานะ</th>
            <th style="width: 150px;">การจัดการ</th>
          </tr>
        </thead>

        <tbody id="list"></tbody>

      </table>

    </div>

  </div>

</div>

<script>

const socket = io();
const room = "2";

socket.emit("joinRoom", room);
socket.emit("getQueue", room);

socket.on("updateQueue", render);


/* =========================
   RENDER
========================= */

function render(data){

    let html = "";

    data.forEach((p,i)=>{

        let badgeClass = "badge-observe";
        let statusText = "รอเรียกคิว";

        if(p.status === "called"){
            badgeClass = "badge-stable";
            statusText = "กำลังเรียกคิว";
        }

        html += `
        <tr>

            <td>${i+1}</td>

            <td><strong>${p.queueNo}</strong></td>

            <td>${p.name}</td>

            <td class="text-soft">
                ${p.note || "-"}
            </td>

            <td>
                <span class="badge ${badgeClass}">
                    ${statusText}
                </span>
            </td>

            <td class="flex gap-10">

                <button class="btn btn-primary btn-sm"
                    onclick="callPatient('${p.queueNo}')">
                    เรียกคิว
                </button>

                <button class="btn btn-success btn-sm"
                    onclick="finishCase('${p.queueNo}')">
                    จ่ายยากลับบ้าน
                </button>

            </td>

        </tr>`;
    });

    document.getElementById("list").innerHTML = html;
}

/* =========================
   CALL PATIENT
========================= */

function callPatient(queueNo){

    socket.emit("callByQueue", {
        room,
        queueNo
    });
}

/* =========================
   FINISH CASE
========================= */

function finishCase(queueNo){

    if(!confirm("Confirm dispense medication?")) return;

    socket.emit("deletePatient", {
        queueNo,
        room
    });
}

</script>

</body>
</html>
